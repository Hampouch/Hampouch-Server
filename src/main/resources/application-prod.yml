spring:
  jpa:
    hibernate:
      # 아직 개발이 진행 중이라 스키마가 계속 바뀌므로 update 유지
      ddl-auto: update
    show-sql: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  level:
    root: WARN
    Hampouch.server: INFO
    org.hibernate.SQL: WARN

management:
  server:
    port: 8081
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus

jwt:
  secret: ${JWT_SECRET}
  access-token-expires-in-ms: ${JWT_ACCESS_TOKEN_EXPIRES_IN_MS}
  refresh-token-expires-in-ms: ${JWT_REFRESH_TOKEN_EXPIRES_IN_MS}

sentry:
  # DSN 미주입이면 SDK가 스스로 비활성 — 이 값 없이도 부팅은 정상 (실값은 EC2 .env 의 SENTRY_DSN)
  dsn: ${SENTRY_DSN:}
