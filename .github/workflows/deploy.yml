name: CD

on:
  push:
    branches: ["main"]
    #main에 새 커밋 없어도 재배포 가능하도록
  workflow_dispatch:

jobs:
  build-and-deploy:
    #Github가 제공하는 임시 가상머신에서 빌드하기 때문에 EC2는 컴파일 부담 x
    runs-on: ubuntu-latest

    steps:
      #1. 저장소 코드를 러너로 가져옴
      - name: Checkout
        uses: actions/checkout@v4

      #2. 빌드에 필요한 자바 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      #3. gradlew 스크립트에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #4. 실행 가능한 jar 파일 빌드
      #-x test: 테스트는 이미 develop 병합 전 PR 단계에서 통과했다고 보고 생략
      - name: Build jar (no tests, tests already ran on PR to develop)
        run: ./gradlew clean bootJar -x test

      #5. Dockerfile.deploy가 요구하는 jar만 있는 폴더를 준비
      - name: Prepare deploy context
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/

      #6. 이미 빌드된 jar를 그대로 담기만 하는 가벼운 이미지 생성
      - name: Build Docker image
        run: docker build -f Dockerfile.deploy -t hampouch-server:latest ./deploy

      #7. 방금 만든 이미지를 파일(.tar) 하나로 압축
      - name: Save Docker image
        run: docker save hampouch-server:latest -o hampouch-server.tar

      #8. 이미지 파일과 최신 운영용 compose 설정을 EC2로 복사
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "hampouch-server.tar,docker-compose.prod.yml"
          target: "~/Hampouch-Server"

      #9. EC2에 SSH로 접속해서 실제 배포 수행 (이전 .tar파일/이미지 삭제 및 app 컨테이너만 갱신)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Hampouch-Server
            docker load -i hampouch-server.tar
            rm hampouch-server.tar
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker image prune -f