name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar (no tests, tests already ran on PR to develop)
        run: ./gradlew clean bootJar -x test

      - name: Prepare deploy context
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/

      - name: Build Docker image
        run: docker build -f Dockerfile.deploy -t hampouch-server:latest ./deploy

      - name: Save Docker image
        run: docker save hampouch-server:latest -o hampouch-server.tar

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "hampouch-server.tar,docker-compose.prod.yml"
          target: "~/Hampouch-Server"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Hampouch-Server
            docker load -i hampouch-server.tar
            rm hampouch-server.tar
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker image prune -f