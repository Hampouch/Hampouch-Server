name: CD

on:
  push:
    branches: ["main"]
    #main에 새 커밋 없어도 재배포 가능하도록
  workflow_dispatch:

concurrency:
  group: hampouch-production-ec2
  cancel-in-progress: false

jobs:
  build-and-deploy:
    #Github가 제공하는 임시 가상머신에서 빌드하기 때문에 EC2는 컴파일 부담 x
    runs-on: ubuntu-latest

    steps:
      #1. 저장소 코드를 러너로 가져옴
      - name: Checkout
        uses: actions/checkout@v7

      #2. 빌드에 필요한 자바 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      #3. gradlew 스크립트에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #4. 실행 가능한 jar 파일 빌드
      #-x test: 테스트는 이미 develop 병합 전 PR 단계에서 통과했다고 보고 생략
      - name: Build jar (no tests, tests already ran on PR to develop)
        run: ./gradlew clean bootJar -x test

      #5. Dockerfile.deploy가 요구하는 jar만 있는 폴더를 준비
      - name: Prepare deploy context
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/

      #6. 이미 빌드된 jar를 그대로 담기만 하는 가벼운 이미지 생성
      #latest 외에 커밋 SHA 태그도 같이 붙여서 EC2에 배포 이력이 남게 한다.
      #문제가 생기면 이전 SHA 이미지를 latest로 재지정해 빠르게 롤백 가능
      - name: Set image tag
        id: vars
        run: |
          echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "compose_sha=$(sha256sum docker-compose.prod.yml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.deploy -t hampouch-server:${{ steps.vars.outputs.sha_tag }} \
            -t hampouch-server:latest ./deploy

      #7. 방금 만든 두 태그(SHA, latest)를 파일(.tar) 하나로 압축
      - name: Save Docker image
        run: docker save hampouch-server:${{ steps.vars.outputs.sha_tag }} hampouch-server:latest -o hampouch-server.tar

      #8. SSH 키를 러너에 준비.
      #표준 scp/ssh 명령으로 대체 - 소유권 불일치로 permission denied가 나는 문제 방지
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host length check:"
          echo -n "${{ secrets.EC2_HOST }}" | wc -c
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || echo "keyscan failed with exit code $?"

      #9. 이미지 파일과 최신 운영용 compose·검증 스크립트를 EC2로 복사
      - name: Prepare deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/Hampouch-Server/scripts/deployment ~/Hampouch-Server/scripts/observability"

      - name: Copy deployment artifacts to EC2
        run: |
          scp -i ~/.ssh/deploy_key hampouch-server.tar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/Hampouch-Server/
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/Hampouch-Server/docker-compose.prod.next.yml
          scp -i ~/.ssh/deploy_key \
            scripts/deployment/deploy-and-verify.sh \
            scripts/deployment/datadog_verification.py \
            scripts/deployment/datadog-verification.json \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/Hampouch-Server/scripts/deployment/
          if [ -f scripts/observability/verify-datadog.sh ]; then
            scp -i ~/.ssh/deploy_key scripts/observability/verify-datadog.sh \
              ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/Hampouch-Server/scripts/observability/
          fi

      #10. EC2에서 배포 후 검증하고 실패하면 이전 앱 이미지로 자동 롤백
      - name: Deploy, verify, and rollback on failure
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd ~/Hampouch-Server && \
            COMPOSE_FILE='docker-compose.prod.next.yml' \
            ACTIVE_COMPOSE_FILE='docker-compose.prod.yml' \
            DEPLOY_SHA_TAG='${{ steps.vars.outputs.sha_tag }}' \
            EXPECTED_COMPOSE_SHA256='${{ steps.vars.outputs.compose_sha }}' \
            bash scripts/deployment/deploy-and-verify.sh"
