name: Datadog Alert Path Verification

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "실행할 운영 검증"
        required: true
        default: alert-path
        type: choice
        options:
          - alert-path
          - flyway-prepare
          - flyway-finalize
          - flyway-disarm
          - deployment-reconcile

permissions:
  contents: read

concurrency:
  group: hampouch-production-ec2
  cancel-in-progress: false

jobs:
  verify-alert-path:
    if: github.event_name == 'schedule' || inputs.operation == 'alert-path'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Verify deployed Alert and Recovery delivery
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd ~/Hampouch-Server && python3 scripts/deployment/datadog_verification.py alert-path"

  prepare-flyway-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'flyway-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout requested release schema
        uses: actions/checkout@v7

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy V1 schema for isolated comparison
        run: |
          scp -i ~/.ssh/deploy_key \
            src/main/resources/db/migration/V1__current_schema.sql \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/Hampouch-Server/.flyway-preflight-${{ github.run_id }}.sql

      - name: Compare production schema and prepare one-time baseline
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "RUN_ID='${{ github.run_id }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/Hampouch-Server
          db_container="hampouch-mysql"
          v1_path="/home/ubuntu/Hampouch-Server/.flyway-preflight-${RUN_ID}.sql"
          temp_db="hampouch_preflight_${RUN_ID}"
          prod_schema="/tmp/hampouch-prod-schema-${RUN_ID}.txt"
          expected_schema="/tmp/hampouch-v1-schema-${RUN_ID}.txt"

          mysql_root() {
            docker exec "$db_container" sh -lc \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names "$@"' \
              sh "$@"
          }

          canonical_schema() {
            schema="$1"
            output="$2"
            {
              echo '[TABLES]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       TABLE_TYPE,
                       COALESCE(ENGINE, '<NULL>'),
                       COALESCE(TABLE_COLLATION, '<NULL>'),
                       COALESCE(CREATE_OPTIONS, ''),
                       COALESCE(TABLE_COMMENT, '')
                  FROM information_schema.tables
                 WHERE table_schema = '${schema}'
                   AND table_name <> 'flyway_schema_history'
                 ORDER BY BINARY TABLE_NAME"

              echo '[COLUMNS_WITHOUT_PHYSICAL_ORDER]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       COLUMN_NAME,
                       COLUMN_TYPE,
                       IS_NULLABLE,
                       CASE
                         WHEN COLUMN_DEFAULT IS NULL THEN '<SQL_NULL>'
                         ELSE CONCAT('<VALUE_HEX>', HEX(CAST(COLUMN_DEFAULT AS CHAR CHARACTER SET utf8mb4)))
                       END,
                       COALESCE(EXTRA, ''),
                       COALESCE(GENERATION_EXPRESSION, ''),
                       COALESCE(CHARACTER_SET_NAME, '<NULL>'),
                       COALESCE(COLLATION_NAME, '<NULL>'),
                       COALESCE(COLUMN_COMMENT, '')
                  FROM information_schema.columns
                 WHERE table_schema = '${schema}'
                   AND table_name <> 'flyway_schema_history'
                 ORDER BY BINARY TABLE_NAME, BINARY COLUMN_NAME"

              echo '[INDEXES]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       INDEX_NAME,
                       NON_UNIQUE,
                       SEQ_IN_INDEX,
                       COALESCE(COLUMN_NAME, '<NULL>'),
                       COALESCE(EXPRESSION, '<NULL>'),
                       COALESCE(SUB_PART, '<NULL>'),
                       COALESCE(COLLATION, '<NULL>'),
                       INDEX_TYPE,
                       COALESCE(IS_VISIBLE, '<NULL>'),
                       COALESCE(INDEX_COMMENT, '')
                  FROM information_schema.statistics
                 WHERE table_schema = '${schema}'
                   AND table_name <> 'flyway_schema_history'
                 ORDER BY BINARY TABLE_NAME, BINARY INDEX_NAME, SEQ_IN_INDEX"

              echo '[TABLE_CONSTRAINTS]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       CONSTRAINT_NAME,
                       CONSTRAINT_TYPE,
                       COALESCE(ENFORCED, '<NULL>')
                  FROM information_schema.table_constraints
                 WHERE table_schema = '${schema}'
                   AND table_name <> 'flyway_schema_history'
                 ORDER BY BINARY TABLE_NAME, BINARY CONSTRAINT_NAME"

              echo '[CONSTRAINT_COLUMNS]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       CONSTRAINT_NAME,
                       COLUMN_NAME,
                       ORDINAL_POSITION,
                       COALESCE(POSITION_IN_UNIQUE_CONSTRAINT, '<NULL>'),
                       COALESCE(REFERENCED_TABLE_NAME, '<NULL>'),
                       COALESCE(REFERENCED_COLUMN_NAME, '<NULL>')
                  FROM information_schema.key_column_usage
                 WHERE table_schema = '${schema}'
                   AND table_name <> 'flyway_schema_history'
                 ORDER BY BINARY TABLE_NAME, BINARY CONSTRAINT_NAME, ORDINAL_POSITION"

              echo '[FOREIGN_KEYS]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       CONSTRAINT_NAME,
                       UNIQUE_CONSTRAINT_NAME,
                       REFERENCED_TABLE_NAME,
                       MATCH_OPTION,
                       UPDATE_RULE,
                       DELETE_RULE
                  FROM information_schema.referential_constraints
                 WHERE constraint_schema = '${schema}'
                 ORDER BY BINARY TABLE_NAME, BINARY CONSTRAINT_NAME"

              echo '[CHECKS]'
              mysql_root --execute="
                SELECT tc.TABLE_NAME,
                       cc.CONSTRAINT_NAME,
                       REGEXP_REPLACE(cc.CHECK_CLAUSE, '[[:space:]]+', ' ')
                  FROM information_schema.check_constraints cc
                  JOIN information_schema.table_constraints tc
                    ON tc.constraint_schema = cc.constraint_schema
                   AND tc.constraint_name = cc.constraint_name
                   AND tc.constraint_type = 'CHECK'
                 WHERE cc.constraint_schema = '${schema}'
                   AND tc.table_name <> 'flyway_schema_history'
                 ORDER BY BINARY tc.TABLE_NAME, BINARY cc.CONSTRAINT_NAME"

              echo '[VIEWS]'
              mysql_root --execute="
                SELECT TABLE_NAME,
                       CHECK_OPTION,
                       IS_UPDATABLE,
                       SECURITY_TYPE,
                       COALESCE(VIEW_DEFINITION, '')
                  FROM information_schema.views
                 WHERE table_schema = '${schema}'
                 ORDER BY BINARY TABLE_NAME"

              echo '[TRIGGERS]'
              mysql_root --execute="
                SELECT TRIGGER_NAME,
                       EVENT_MANIPULATION,
                       EVENT_OBJECT_TABLE,
                       ACTION_ORDER,
                       ACTION_ORIENTATION,
                       ACTION_TIMING,
                       COALESCE(ACTION_CONDITION, '<NULL>'),
                       ACTION_STATEMENT
                  FROM information_schema.triggers
                 WHERE trigger_schema = '${schema}'
                 ORDER BY BINARY TRIGGER_NAME"
            } > "$output"
          }

          set_baseline_flag() {
            python3 - "$1" <<'PY'
          import os
          from pathlib import Path
          import sys

          path = Path("/home/ubuntu/Hampouch-Server/.env")
          key = "FLYWAY_BASELINE_ON_MIGRATE"
          value = sys.argv[1]
          original = path.read_text(encoding="utf-8").splitlines(keepends=True)
          updated = []
          replaced = False
          for line in original:
              if line.startswith(f"{key}="):
                  if not replaced:
                      updated.append(f"{key}={value}\n")
                      replaced = True
              else:
                  updated.append(line)
          if not replaced:
              if updated and not updated[-1].endswith("\n"):
                  updated[-1] += "\n"
              updated.append(f"{key}={value}\n")
          temporary = path.with_name(".env.flyway-tmp")
          temporary.write_text("".join(updated), encoding="utf-8")
          os.chmod(temporary, path.stat().st_mode)
          os.replace(temporary, path)
          PY
          }

          cleanup() {
            set +e
            mysql_root --execute="DROP DATABASE IF EXISTS \`${temp_db}\`" >/dev/null 2>&1
            rm -f "$v1_path" "$prod_schema" "$expected_schema"
          }
          trap cleanup EXIT

          db_name="$(docker exec "$db_container" sh -lc 'printf %s "$MYSQL_DATABASE"')"
          case "$db_name" in
            ''|*[!A-Za-z0-9_]*)
              echo "운영 DB 이름을 안전하게 확인하지 못했습니다." >&2
              exit 1
              ;;
          esac

          history_exists="$(mysql_root --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db_name}' AND table_name='flyway_schema_history'")"
          table_count="$(mysql_root --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db_name}' AND table_name <> 'flyway_schema_history'")"
          echo "PRODUCTION_TABLE_COUNT=${table_count}"

          if [ "$history_exists" = "1" ]; then
            failed_count="$(mysql_root --execute="SELECT COUNT(*) FROM \`${db_name}\`.flyway_schema_history WHERE success <> 1")"
            if [ "$failed_count" != "0" ]; then
              echo "Flyway 실패 이력이 있어 배포를 준비할 수 없습니다." >&2
              exit 1
            fi
            set_baseline_flag false
            echo "FLYWAY_HISTORY=ALREADY_PRESENT"
            echo "FLYWAY_BASELINE_ON_MIGRATE=SET_FALSE"
            exit 0
          fi

          if [ "$table_count" = "0" ]; then
            set_baseline_flag false
            echo "SCHEMA_STATE=EMPTY"
            echo "FLYWAY_BASELINE_ON_MIGRATE=SET_FALSE"
            exit 0
          fi

          mysql_root --execute="CREATE DATABASE \`${temp_db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          docker exec -i "$db_container" sh -lc \
            'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --default-character-set=utf8mb4 "$1"' \
            sh "$temp_db" < "$v1_path"

          canonical_schema "$db_name" "$prod_schema"
          canonical_schema "$temp_db" "$expected_schema"

          if ! cmp --silent "$prod_schema" "$expected_schema"; then
            echo "SCHEMA_MATCH=NO" >&2
            echo "운영 스키마가 V1과 달라 baseline을 활성화하지 않았습니다." >&2
            echo "SCHEMA_DIFF_BEGIN"
            diff --unified=1 "$expected_schema" "$prod_schema" | sed -n '1,400p' || true
            echo "SCHEMA_DIFF_END"
            exit 1
          fi

          set_baseline_flag true
          echo "SCHEMA_MATCH=YES"
          echo "FLYWAY_HISTORY=ABSENT"
          echo "FLYWAY_BASELINE_ON_MIGRATE=SET_TRUE"
          REMOTE

  finalize-flyway-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'flyway-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Verify migration history and disable one-time baseline
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/Hampouch-Server
          db_container="hampouch-mysql"

          mysql_root() {
            docker exec "$db_container" sh -lc \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names "$@"' \
              sh "$@"
          }

          db_name="$(docker exec "$db_container" sh -lc 'printf %s "$MYSQL_DATABASE"')"
          case "$db_name" in
            ''|*[!A-Za-z0-9_]*)
              echo "운영 DB 이름을 안전하게 확인하지 못했습니다." >&2
              exit 1
              ;;
          esac

          history_exists="$(mysql_root --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db_name}' AND table_name='flyway_schema_history'")"
          if [ "$history_exists" != "1" ]; then
            echo "flyway_schema_history가 없어 전환을 완료할 수 없습니다." >&2
            exit 1
          fi

          failed_count="$(mysql_root --execute="SELECT COUNT(*) FROM \`${db_name}\`.flyway_schema_history WHERE success <> 1")"
          missing_count="$(mysql_root --execute="SELECT 4 - COUNT(DISTINCT version) FROM \`${db_name}\`.flyway_schema_history WHERE version IN ('1','2','3','4') AND success = 1")"
          unexpected_count="$(mysql_root --execute="SELECT COUNT(*) FROM \`${db_name}\`.flyway_schema_history WHERE version IS NOT NULL AND version NOT IN ('1','2','3','4')")"
          if [ "$failed_count" != "0" ] || [ "$missing_count" != "0" ] || [ "$unexpected_count" != "0" ]; then
            echo "Flyway V1~V4 성공 이력이 완전하지 않습니다." >&2
            exit 1
          fi

          history_summary="$(mysql_root --execute="SELECT GROUP_CONCAT(CONCAT(version, ':', type, ':', success) ORDER BY installed_rank SEPARATOR ',') FROM \`${db_name}\`.flyway_schema_history WHERE version IS NOT NULL")"

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("/home/ubuntu/Hampouch-Server/.env")
          key = "FLYWAY_BASELINE_ON_MIGRATE"
          original = path.read_text(encoding="utf-8").splitlines(keepends=True)
          updated = []
          replaced = False
          for line in original:
              if line.startswith(f"{key}="):
                  if not replaced:
                      updated.append(f"{key}=false\n")
                      replaced = True
              else:
                  updated.append(line)
          if not replaced:
              if updated and not updated[-1].endswith("\n"):
                  updated[-1] += "\n"
              updated.append(f"{key}=false\n")
          temporary = path.with_name(".env.flyway-tmp")
          temporary.write_text("".join(updated), encoding="utf-8")
          os.chmod(temporary, path.stat().st_mode)
          os.replace(temporary, path)
          PY

          echo "FLYWAY_HISTORY=${history_summary}"
          echo "FLYWAY_BASELINE_ON_MIGRATE=SET_FALSE"
          REMOTE

  disarm-flyway-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'flyway-disarm'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Disable one-time Flyway baseline
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'python3 -' <<'PY'
          import os
          from pathlib import Path

          path = Path("/home/ubuntu/Hampouch-Server/.env")
          key = "FLYWAY_BASELINE_ON_MIGRATE"
          original = path.read_text(encoding="utf-8").splitlines(keepends=True)
          updated = []
          replaced = False
          for line in original:
              if line.startswith(f"{key}="):
                  if not replaced:
                      updated.append(f"{key}=false\n")
                      replaced = True
              else:
                  updated.append(line)
          if not replaced:
              if updated and not updated[-1].endswith("\n"):
                  updated[-1] += "\n"
              updated.append(f"{key}=false\n")
          temporary = path.with_name(".env.flyway-tmp")
          temporary.write_text("".join(updated), encoding="utf-8")
          os.chmod(temporary, path.stat().st_mode)
          os.replace(temporary, path)
          print("FLYWAY_BASELINE_ON_MIGRATE=SET_FALSE")
          PY

  reconcile-cancelled-deployment:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deployment-reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Reconcile cancelled deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/Hampouch-Server
          sha_tag="f9af1e59"
          expected_compose_sha="f2ad476559fc3e14641637f823cca435e551aec7eb8b23d92c02fc05be47d998"
          expected_agent_version="7.82.1"
          candidate_compose="docker-compose.prod.next.yml"
          active_compose="docker-compose.prod.yml"
          minimum_available_memory_mb=256
          maximum_container_memory_percent=90
          containers=(hampouch-server hampouch-mysql hampouch-datadog)
          log_probe_containers=(hampouch-app-log-probe hampouch-mysql-log-probe)

          docker rm -f "${log_probe_containers[@]}" >/dev/null 2>&1 || true
          for probe in "${log_probe_containers[@]}"; do
            if docker inspect "$probe" >/dev/null 2>&1; then
              echo "$probe 정리에 실패했습니다." >&2
              exit 1
            fi
          done
          echo "LOG_PROBES=ABSENT"

          active_sha=""
          candidate_sha=""
          if [ -f "$active_compose" ]; then
            active_sha="$(sha256sum "$active_compose" | awk '{print $1}')"
          fi
          if [ -f "$candidate_compose" ]; then
            candidate_sha="$(sha256sum "$candidate_compose" | awk '{print $1}')"
            if [ "$candidate_sha" != "$expected_compose_sha" ]; then
              echo "대기 중인 Compose가 취소된 배포 산출물과 다릅니다." >&2
              exit 1
            fi
            compose_to_verify="$candidate_compose"
            promote_candidate=true
          elif [ "$active_sha" = "$expected_compose_sha" ]; then
            compose_to_verify="$active_compose"
            promote_candidate=false
          else
            echo "검증할 배포 Compose 산출물을 찾지 못했습니다." >&2
            exit 1
          fi
          docker compose -f "$compose_to_verify" config --quiet

          expected_image_id="$(docker image inspect "hampouch-server:${sha_tag}" --format='{{.Id}}')"
          running_image_id="$(docker inspect --format='{{.Image}}' hampouch-server)"
          if [ "$running_image_id" != "$expected_image_id" ]; then
            echo "실행 중인 앱 이미지가 배포 SHA 이미지와 다릅니다." >&2
            exit 1
          fi
          echo "APP_IMAGE_SHA=${sha_tag}"

          for container in "${containers[@]}"; do
            health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
            if [ "$health" != "healthy" ]; then
              echo "$container 상태가 healthy가 아닙니다: $health" >&2
              exit 1
            fi
            echo "${container}_health=healthy"
          done

          if ! docker exec hampouch-server curl -fsS http://localhost:8081/actuator/health/readiness 2>/dev/null \
            | grep -q '"status":"UP"'; then
            docker exec hampouch-server curl -fsS http://localhost:8080/actuator/health \
              | grep -q '"status":"UP"'
          fi
          echo "APP_READINESS=UP"

          docker exec hampouch-mysql sh -ec \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" "$MYSQL_DATABASE" --skip-column-names --execute="SELECT 1"' \
            | grep -qx '1'
          echo "MYSQL_READ_ONLY_QUERY=PASS"

          docker exec hampouch-datadog agent health >/dev/null
          agent_output="$(docker exec hampouch-datadog agent version)"
          agent_version="$(sed -nE 's/^Agent ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' <<<"$agent_output" | head -n 1)"
          if [ "$agent_version" != "$expected_agent_version" ]; then
            echo "Datadog Agent 버전이 ${expected_agent_version}가 아닙니다." >&2
            exit 1
          fi
          echo "DATADOG_AGENT_VERSION=${agent_version}"

          flyway_flag_count="$(grep -c '^FLYWAY_BASELINE_ON_MIGRATE=' .env || true)"
          if [ "$flyway_flag_count" != "1" ] || ! grep -qx 'FLYWAY_BASELINE_ON_MIGRATE=false' .env; then
            echo "Flyway 일회성 baseline 플래그가 안전하게 해제되지 않았습니다." >&2
            exit 1
          fi
          echo "FLYWAY_BASELINE_ON_MIGRATE=false"

          available_memory_mb="$(awk '/MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)"
          case "$available_memory_mb" in
            ''|*[!0-9]*)
              echo "호스트 가용 메모리를 확인하지 못했습니다." >&2
              exit 1
              ;;
          esac
          if [ "$available_memory_mb" -lt "$minimum_available_memory_mb" ]; then
            echo "호스트 가용 메모리가 ${minimum_available_memory_mb}MB보다 적습니다." >&2
            exit 1
          fi
          echo "HOST_AVAILABLE_MEMORY_MB=${available_memory_mb}"

          stats="$(docker stats --no-stream --format '{{.Name}}|{{.MemPerc}}' "${containers[@]}")"
          stats_count="$(printf '%s\n' "$stats" | grep -c '|' || true)"
          if [ "$stats_count" != "${#containers[@]}" ]; then
            echo "운영 컨테이너 메모리 사용률을 모두 확인하지 못했습니다." >&2
            exit 1
          fi
          while IFS='|' read -r container memory_percent; do
            numeric_percent="${memory_percent%%%}"
            if ! awk -v value="$numeric_percent" -v limit="$maximum_container_memory_percent" \
              'BEGIN { exit(value <= limit ? 0 : 1) }'; then
              echo "$container 메모리 사용률이 ${maximum_container_memory_percent}%를 넘었습니다." >&2
              exit 1
            fi
            echo "${container}_memory_percent=${numeric_percent}"
          done <<<"$stats"

          if [ "$promote_candidate" = true ]; then
            mv -f -- "$candidate_compose" "$active_compose"
          fi
          final_compose_sha="$(sha256sum "$active_compose" | awk '{print $1}')"
          if [ "$final_compose_sha" != "$expected_compose_sha" ]; then
            echo "활성 Compose 체크섬이 배포 산출물과 다릅니다." >&2
            exit 1
          fi
          docker compose -f "$active_compose" config --quiet

          final_running_image_id="$(docker inspect --format='{{.Image}}' hampouch-server)"
          if [ "$final_running_image_id" != "$expected_image_id" ]; then
            echo "Compose 승격 후 실행 이미지 검증에 실패했습니다." >&2
            exit 1
          fi
          echo "ACTIVE_COMPOSE_SHA256=${final_compose_sha}"
          echo "DEPLOYMENT_RECONCILED_SHA=${sha_tag}"
          REMOTE
