name: Repository Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-and-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$actionlint_archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check --strict
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint

          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$shellcheck_archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check --strict
          tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"

          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint

      - name: Validate tracked shell scripts
        run: |
          scripts=()
          while IFS= read -r -d '' script; do
            scripts+=("$script")
          done < <(git ls-files -z -- '*.sh')
          if (( ${#scripts[@]} > 0 )); then
            bash -n "${scripts[@]}"
            shellcheck "${scripts[@]}"
          fi

      - name: Reject unresolved merge markers
        run: |
          if git grep -nI -E '^(<{7}|={7}|>{7})( .*)?$' -- .; then
            echo "해결되지 않은 merge marker가 있습니다." >&2
            exit 1
          fi
